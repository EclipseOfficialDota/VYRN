# Existing-Nginx deployment. Certificate must be issued before enabling this file.
map $http_upgrade $vyrn_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name vyrn.eclipseofficial.xyz api.vyrn.eclipseofficial.xyz ws.vyrn.eclipseofficial.xyz media.vyrn.eclipseofficial.xyz push.vyrn.eclipseofficial.xyz admin.vyrn.eclipseofficial.xyz updates.vyrn.eclipseofficial.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/vyrn/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.vyrn.eclipseofficial.xyz ws.vyrn.eclipseofficial.xyz media.vyrn.eclipseofficial.xyz push.vyrn.eclipseofficial.xyz;
    ssl_certificate /etc/letsencrypt/live/vyrn-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vyrn-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 251m;
    location = /metrics { return 404; }
    location = /v1/admin { return 404; }
    location ^~ /v1/admin/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vyrn_connection_upgrade;
        proxy_read_timeout 75s;
    }
}
server {
    listen 443 ssl;
    server_name vyrn.eclipseofficial.xyz admin.vyrn.eclipseofficial.xyz updates.vyrn.eclipseofficial.xyz;
    ssl_certificate /etc/letsencrypt/live/vyrn-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vyrn-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location / { return 503 "VYRN: this service is not publicly available yet.\n"; }
}
