# Local smoke stack. No public listener, DNS request or ACME certificate issuance.
services:
  core:
    image: vyrn-core:dev
    ports: ["127.0.0.1:18080:8080"]
    environment:
      VYRN_ADMIN_ORIGIN: http://127.0.0.1:18080
      VYRN_ADMIN_DIR: /admin
      VYRN_TRUSTED_PROXY: 172.29.71.0/24
    volumes:
      - ../admin:/admin:ro
  caddy:
    profiles: [production]
  devtls:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [android]
    ports: ["127.0.0.1:18443:443"]
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - devtls_data:/data
      - devtls_config:/config
    networks: [edge]
    depends_on: [core]
    mem_limit: 128m
volumes:
  devtls_data:
  devtls_config:
networks:
  edge:
    ipam:
      config: !override [{subnet: 172.29.71.0/24}]
