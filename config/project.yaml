product:
  name: VYRN
  android_package: xyz.eclipseofficial.vyrn
  backend_name: VYRN Core
  admin_name: VYRN Control
  updates_name: VYRN Updates
  languages: [fa, en]
  minimum_android_api: 26
  default_theme: system
  default_language: system
upstream:
  repository: https://github.com/DrKLO/Telegram.git
  commit: f2908b14133bbffbf7ab04f641ecb5bfaf533242
  version: 12.10.6
server:
  # Documentation defaults; runtime settings come from the operator's env file.
  os_expected: Ubuntu 24.04 LTS
  timezone: Asia/Tehran
  memory_mb: 4096
  disk_gb: 40
  provider_udp_confirmed: false
domains:
  web: vyrn.example.com
  api: api.vyrn.example.com
  websocket: ws.vyrn.example.com
  media: media.vyrn.example.com
  push: push.vyrn.example.com
  admin: admin.vyrn.example.com
  updates: updates.vyrn.example.com
  turn: turn.vyrn.example.com
  turn_proxy: false
limits:
  upload_bytes: 262144000
  avatar_bytes: 10485760
  voice_bytes: 104857600
  group_members: 250
  devices_per_user: 3
  message_characters: 16384
  user_soft_quota_bytes: 2147483648
  minimum_free_bytes: 10737418240
  orphan_retention_days: 7
features:
  voice_calls: false
  video_calls: false
  channels: false
  bots: false
  stories: false
  group_calls: false
backup:
  external_destination: null
  daily_retention: 7
  weekly_retention: 4
assets:
  original_logo_path: assets/vyrn-logo-original.jpg
signing:
  keystore_path: null
  keystore_path_env: VYRN_KEYSTORE_PATH
  alias_env: VYRN_KEY_ALIAS
  store_password_env: VYRN_STORE_PASSWORD
  key_password_env: VYRN_KEY_PASSWORD
