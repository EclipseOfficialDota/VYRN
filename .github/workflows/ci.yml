name: CI

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject sensitive tracked files and oversized blobs
        run: python3 scripts/check-repository.py
      - name: Check administrator JavaScript
        run: node --check admin/app.js
      - name: Check shell scripts
        run: bash -n setup.sh scripts/backup.sh scripts/restore-smoke.sh
      - name: Check interactive setup contracts offline
        run: python3 scripts/test-setup-server.py
      - name: Check Linux Android build orchestration without SDK downloads
        run: |
          python3 scripts/test-android-linux.py
          python3 scripts/test-android-offline.py
          python3 scripts/test-android-kit.py
      - name: Check offline distribution packaging without a daemon
        run: python3 scripts/test-lite-package.py
      - name: Check DNS planning without external requests
        shell: pwsh
        run: ./scripts/test-cloudflare-dns.ps1
      - name: Validate custom-domain self-host configuration
        env:
          VYRN_DOMAIN: chat.example.com
          VYRN_IMAGE: vyrn-core:ci
          POSTGRES_PASSWORD: disposable-config-check-only
          VYRN_ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
          VYRN_ADMIN_ALLOWED_CIDRS: 192.0.2.10/32
        run: |
          docker compose -f deployment/compose.yaml config -q
          docker compose -f deployment/compose.yaml -f deployment/compose.setup-proxy.yaml config -q
          docker compose -f deployment/compose.yaml -f deployment/compose.lite.yaml config -q
          python3 scripts/test-lite-compose.py
          docker run --rm --network none --memory 128m --cpus 1 \
            -e VYRN_DOMAIN -e VYRN_ADMIN_ALLOWED_CIDRS \
            -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate >/dev/null
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts,android -Filter '*.ps1' -Recurse | ForEach-Object {
            $parseErrors=$null
            $tokens=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if($parseErrors.Count){throw "PowerShell syntax error in $($_.Name)"}
          }

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: vyrn_ci
          POSTGRES_USER: vyrn_ci
          # Disposable loopback-only CI database; no deployment credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U vyrn_ci -d vyrn_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://vyrn_ci@127.0.0.1:5432/vyrn_ci?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Unit and PostgreSQL integration tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build production container
        working-directory: .
        run: docker build --tag vyrn-core:ci --file backend/Dockerfile backend
      - name: Check real installer bootstrap and data preservation
        working-directory: .
        run: python3 scripts/test-setup-server.py --integration
      - name: Exercise Lite runtime and record scoped idle samples
        working-directory: .
        run: |
          docker build --tag vyrn-core:lite-ci --file backend/Dockerfile.lite backend
          python3 scripts/test-setup-server.py --integration --lite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lite-runtime-samples
          path: artifacts/lite-runtime.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7
          if-no-files-found: error

  publish-containers:
    needs: [repository, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish tested source for AMD64 and ARM64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker buildx create --name vyrn-publish --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 --file backend/Dockerfile.lite \
            --tag ghcr.io/eclipseofficialdota/vyrn-lite:sha-$GITHUB_SHA \
            --tag ghcr.io/eclipseofficialdota/vyrn-lite:preview --push backend
      - name: Package all runtime images for offline transfer
        run: bash scripts/package-offline.sh "$GITHUB_SHA" artifacts/offline
      - name: Publish server preview bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' 'Server container development preview; this is not a Stable Android release.' \
            'Bundles include Core, PostgreSQL and Caddy images, Compose files, public admin assets and checksums for offline installation.' \
            'See docs/DOCKER_LITE.md for setup, resource limits and validation scope.' > artifacts/offline/release-notes.md
          gh release create "containers-${GITHUB_SHA:0:12}" artifacts/offline/*.tar.gz artifacts/offline/*.sha256 \
            --target "$GITHUB_SHA" --prerelease --title "Docker preview ${GITHUB_SHA:0:12}" \
            --notes-file artifacts/offline/release-notes.md
